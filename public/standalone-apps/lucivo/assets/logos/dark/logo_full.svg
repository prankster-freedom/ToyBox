<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240">
  <defs>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Symbol (LV Monogram & Dynamic Wave) -->
  <g transform="translate(36, 32)">
    <path d="M 30 18 L 30 130 A 24 24 0 0 0 54 154 L 110 154" fill="none" stroke="#00f0ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#fGlow)"/>
    <path d="M 96 68 L 134 140 A 14 14 0 0 0 158 140 L 196 68" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 30 84 L 96 68" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 8"/>
    <circle cx="30" cy="18" r="14" fill="#ffffff" filter="url(#fGlow)"/>
    <circle cx="110" cy="154" r="12" fill="#00f0ff"/>
    <circle cx="96" cy="68" r="11" fill="#38bdf8"/>
    <circle cx="196" cy="68" r="13" fill="#00f0ff" filter="url(#fGlow)"/>
  </g>
  
  <!-- Brand Text -->
  <g transform="translate(270, 0)">
    <!-- Product Name: Lucivo (Rounded Monospace) -->
    <text x="0" y="106" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace" font-size="88" font-weight="700" fill="#f8fafc" letter-spacing="4">Lucivo</text>
    
    <!-- Full Title: Markdown Presenter -->
    <text x="4" y="156" font-family="'JetBrains Mono', 'SF Pro Text', -apple-system, sans-serif" font-size="28" font-weight="500" fill="#38bdf8" letter-spacing="3">Markdown Presenter</text>
    
    <!-- Tagline: — Exhibition-Grade Markdown Viewer — -->
    <text x="4" y="196" font-family="'JetBrains Mono', -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="5">— Exhibition-Grade Markdown Viewer —</text>
  </g>
</svg>